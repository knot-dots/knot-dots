# The AI bugfix agent: started from the Google Chat bug channel ("@claude …")
# or by hand, it reproduces the reported defect against a running knot-dots,
# writes a test, fixes it and opens a draft pull request here.
#
# Only the triggers live in this repository. The workflow, its scripts and the
# agent's instructions are in knot-dots/clemens-playground; running it from
# here lets it use this repository's Docker build cache and the federated
# Claude API and Google Cloud identities, which accept knot-dots.
name: AI bugfix

on:
  repository_dispatch:
    types: [chat-bugfix]
  workflow_dispatch:
    inputs:
      report:
        description: The bug report
        required: true
      thread:
        description: Google Chat thread to reply to (spaces/…/threads/…)
        required: false

concurrency:
  # One run per chat thread, queued instead of cancelled: a follow-up mention
  # must not kill the run it is following up on.
  group: ai-bugfix-${{ github.event.client_payload.thread || inputs.thread || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  # A run with nothing to work on cancels itself.
  actions: write
  # Federated sign-in to the Claude API and Google Chat; no key is stored.
  id-token: write

jobs:
  bugfix:
    uses: knot-dots/clemens-playground/.github/workflows/ai-bugfix.yaml@main
    with:
      report: ${{ inputs.report }}
      thread: ${{ inputs.thread }}
    # Only the one token the workflow needs, not all of this repository's secrets.
    secrets:
      PLAYGROUND_TOKEN: ${{ secrets.PLAYGROUND_TOKEN }}
